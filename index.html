function dateRange(p,sv,ev,withTime,req,label){
  const t=withTime?'datetime-local':'date';
  return `<div class="daterange" data-range="1" ${req===false?'':'data-req-range="1"'} data-label="${label||'노출기간'}"><input type="${t}" id="${p}-s" value="${sv||''}"> <span class="dsep">~</span> <input type="${t}" id="${p}-e" value="${ev||''}"></div>`;
}
function convertDateboxes(html){
  let n=0;
  return html.replace(/<div class="datebox"><span class="ic">&#128197;<\/span>([\s\S]*?)<\/div>/g,function(all,txt){
    const ds=[]; let m;
    const reE=/([A-Z][a-z]{2}) (\d{1,2}), (\d{4})(?:\s+(\d{1,2}):(\d{2}))?/g;
    while((m=reE.exec(txt))){ ds.push({y:m[3],mo:MONIDX[m[1]],d:+m[2],t:(m[4]!=null)?[+m[4],m[5]]:null}); }
    if(!ds.length){ const reI=/(\d{4})-(\d{2})-(\d{2})(?:\s+(\d{1,2}):(\d{2}))?/g; while((m=reI.exec(txt))){ ds.push({y:m[1],mo:+m[2],d:+m[3],t:(m[4]!=null)?[+m[4],m[5]]:null}); } }
    if(!ds.length) return all;
    const p2=function(x){ return ('0'+x).slice(-2); };
    const val=function(o){ return o.y+'-'+p2(o.mo)+'-'+p2(o.d)+(o.t?'T'+p2(o.t[0])+':'+o.t[1]:''); };
    n++;
    return dateRange('dr'+n,val(ds[0]),ds[1]?val(ds[1]):'',!!ds[0].t,true);
  });
}

function uploaderHtml(id,o){

        <div class="up-hint">${o.hint||'PNG, JPG, JPEG'}</div>
        <div class="up-warn"></div>
      </div>
    </div></div>`;

function upDrag(e,id,on){ e.preventDefault(); const el=document.getElementById(id); if(el&&el.classList) el.classList.toggle('drag',!!on); }
function upDrop(e,id){ e.preventDefault(); upDrag(e,id,false); const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; upFile(id,f); }
function upPick(input,id){ upFile(id,input.files&&input.files[0]); input.value=''; }
function upFile(id,file){
  if(!file) return;
  const el=document.getElementById(id);
  const svgOnly=(el.getAttribute('data-types')==='svg');
  if(!(svgOnly?/^image\/svg\+xml$/:/^image\/(png|jpe?g)$/).test(file.type)){ setErr(el,svgOnly?'SVG 파일만 등록할 수 있습니다.':'PNG, JPG, JPEG 파일만 등록할 수 있습니다.'); return; }
  const rd=new FileReader();
  rd.onload=function(){
    const img=new Image();
    img.onload=function(){ upApply(id,{name:file.name,url:rd.result,w:img.naturalWidth,h:img.naturalHeight}); };
    img.onerror=function(){ upApply(id,{name:file.name,url:rd.result}); };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);

function setErr(el,msg){

  const body=el.closest('.fbody'); if(!body) return;

  if(!e){ e=document.createElement('div'); e.className='field-err v'; body.appendChild(e); }

function clearErrFor(e){

  const body=holder.closest('.fbody');

function validateForm(){
  const card=document.querySelector('.form-card'); if(!card) return true;
  let first=null;
  const fail=function(el,msg){ setErr(el,msg); if(!first) first=el; };
  card.querySelectorAll('[data-req]').forEach(function(el){
    if(el.closest('[data-deleted]')||el.closest('.hidden-field')) return;
    if(el.classList.contains('uploader')){
      if(el.getAttribute('data-has')!=='1') fail(el,'이미지를 등록해 주세요.'); else setErr(el,'');
      return;
    }
    const v=(el.value||'').trim(), lab=el.getAttribute('data-label')||'값';
    const mn=+el.getAttribute('data-min')||0, mx=+el.getAttribute('data-max')||0, len=Array.from(v).length;
    let msg='';
    if(!v) msg=lab+'을(를) 입력해 주세요.';
    else if((mn&&len<mn)||(mx&&len>mx)) msg=lab+'은(는) '+(mn||1)+'~'+(mx||'')+'자로 입력해 주세요.';
    else if(el.getAttribute('data-pattern') && !new RegExp(el.getAttribute('data-pattern')).test(v)) msg=el.getAttribute('data-pattern-msg')||(lab+' 형식을 확인해 주세요.');
    if(msg) fail(el,msg); else setErr(el,'');
  });
  card.querySelectorAll('[data-pattern]:not([data-req])').forEach(function(el){
    if(el.closest('[data-deleted]')||el.closest('.hidden-field')) return;
    const v=(el.value||'').trim();
    if(!v){ setErr(el,''); return; }
    if(!new RegExp(el.getAttribute('data-pattern')).test(v)) fail(el,el.getAttribute('data-pattern-msg')||'형식을 확인해 주세요.'); else setErr(el,'');
  });
  card.querySelectorAll('.daterange[data-range]').forEach(function(dr){
    if(dr.closest('.hidden-field')) return;
    const ins=dr.querySelectorAll('input'), a=ins[0].value, b=ins[1].value;
    let msg='';
    if(dr.hasAttribute('data-req-range') && (!a||!b)) msg=(dr.getAttribute('data-label')||'노출기간')+'의 시작일과 종료일을 입력해 주세요.';
    else if(a&&b&&a>b) msg='종료일은 시작일 이후여야 합니다.';
    if(msg) fail(dr,msg); else setErr(dr,'');
  });
  const lg=card.querySelector('.landing-group');
  if(lg){
    const sel=lg.querySelector('input[name="f-ltype"]:checked'), inEl=document.getElementById('landing-input'), outEl=document.getElementById('landing-url');
    let msg='', target=inEl;
    if(sel&&sel.value==='out'){ target=outEl; if(!/^https?:\/\//.test((outEl.value||'').trim())) msg='https://로 시작하는 URL을 입력해 주세요.'; }
    else if(!(inEl.value||'').trim()) msg='앱 페이지를 선택하거나 [+ 앱 페이지 추가]로 등록해 주세요.';
    if(msg) fail(lg,msg); else setErr(lg,'');
  }
  const pg=card.querySelector('.pos-group');
  if(pg){
    const sel=pg.querySelector('input[name="f-pos"]:checked'); let msg='';
    if(sel&&sel.value==='seq'){ const n=+document.getElementById('f-order').value; if(!(n>=1&&Math.floor(n)===n)) msg='순서는 1 이상의 숫자로 입력해 주세요.'; }
    else if(!(document.getElementById('f-sub').value||'').trim()) msg='상품을 선택해 주세요.';
    if(msg) fail(pg,msg); else setErr(pg,'');
  }
  const bg=card.querySelector('.brand-group');
  if(bg){ if(!bg.querySelector('input:checked')) fail(bg,'브랜드를 1개 이상 선택해 주세요.'); else setErr(bg,''); }
  const pc=document.getElementById('f-code');
  if(pc&&state.editKey){ const me=productRowByKey(state.editKey); if(me&&growthProducts.rows.some(function(r){return r!==me&&r.code===pc.value.trim();})) fail(pc,'이미 사용 중인 그룹 코드입니다.'); }
  const ver=document.getElementById('f-ver');
  if(ver&&state.editKey==='regAppVer'&&ver.value.trim()&&appVersions.rows.some(function(r){return r.ver===ver.value.trim();})) fail(ver,'이미 등록된 버전입니다.');
  if(first){
    if(first.scrollIntoView) first.scrollIntoView({block:'center',behavior:'smooth'});
    if(first.focus&&first.tagName==='INPUT') first.focus();
    return false;
  }
  return true;
}

function csvCell(x){ x=String(x==null?'':x); return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; }
function downloadCsv(name,text){
  try{
    const blob=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },1000);
    return true;
  }catch(e){ return false; }
}

/* 노출기간 겹침 */
function periodsOverlap(a1,a2,b1,b2){ return a1<=b2 && b1<=a2; }
function evPeriodISO(p){ const m=p.match(/(\d{4})\.(\d{2})\.(\d{2})~(\d{4})\.(\d{2})\.(\d{2})/); return m?[m[1]+'-'+m[2]+'-'+m[3],m[4]+'-'+m[5]+'-'+m[6]]:['','']; }
function overlapItems(){
  const key=state.editKey; if(!key) return [];
  const sEl=document.getElementById('f-date-s'), eEl=document.getElementById('f-date-e'); if(!sEl||!eEl) return [];
  const s=sEl.value.slice(0,10), e=eEl.value.slice(0,10); if(!s||!e||s>e) return [];
  const useEl=document.querySelector('input[name="f-use"]:checked'); if(useEl&&useEl.value==='0') return [];
  let list=[];
  const brow=(key==='regBanner')?null:bannerRow(key);
  if(key==='regBanner'||brow){
    const type=(key==='regBanner')?(state.reg&&state.reg.type):(bannerPopupRows().find(function(x){return x.r.editKey===key;})||{}).t;
    list=bannerPopupRows().filter(function(x){return x.t===type&&x.r.editKey!==key&&x.r.use;}).map(function(x){ return {label:x.r.label.replace(/\\n/g,' '),p:periodISO(x.r.period)}; });
  } else if((key==='regNotice'&&state.reg&&state.reg.type==='event')||String(key).indexOf('evt')===0){
    list=badgeEvents.rows.filter(function(r){return r.id!==key&&r.expose;}).map(function(r){ return {label:r.name,p:evPeriodISO(r.period)}; });
  }
  return list.filter(function(x){ return x.p[0] && periodsOverlap(s,e,x.p[0],x.p[1]); });
}
function setWarn(el,msg){
  if(!el||!el.closest) return;
  const body=el.closest('.fbody'); if(!body) return;
  let w=body.querySelector('.field-warn');
  if(!w){ w=document.createElement('div'); w.className='field-warn'; body.appendChild(w); }
  w.textContent=msg||'';
}
function liveOverlapHint(e){
  const t=e&&e.target; if(!t||!t.closest||!document.querySelector) return;
  if(!(t.closest('.daterange')||t.name==='f-use')) return;
  const dr=document.querySelector('.form-card .daterange'); if(!dr) return;
  const ov=overlapItems();
  setWarn(dr,ov.length?('같은 유형에 노출기간이 겹치는 노출 건이 '+ov.length+'건 있습니다. ('+ov[0].label+(ov.length>1?' 외':'')+')'):'');
}

const MENU_PERM={'product-main':'product','content-banner':'content','content-notice':'content','content-badge':'content','app-ops':'appops','app-voc':'appops','auth-perm':'auth','auth-log':'auth'};
const OP_LABEL={c:'등록',r:'조회',u:'수정',d:'삭제'};
const PERM_REQ=[];
function permKeyOf(menu,tab){ return (menu==='app-ops'&&tab==='digital')?'digital':MENU_PERM[menu]; }
function curAccount(){ return AUTH_ACCOUNTS.find(function(a){ return a.id===curEmail(); }); }
function demoGeneral(){ return AUTH_ACCOUNTS.find(function(a){ return a.id==='suho_jang@daekyo.co.kr'; }); }
function curPerm(){ const a=curAccount(); if(a&&!a.master&&a.perm) return a.perm; return (demoGeneral()||{perm:{}}).perm; }
function curPermName(){ const a=curAccount(); return (a&&!a.master)?a.name:(demoGeneral()||{}).name; }
function can(menu,op,tab){
  if(state.role==='master') return true;
  const p=curPerm()[permKeyOf(menu,tab)]||'';
  return p.indexOf(op)>=0;
}
function canMenu(k){ return can(k,'r')||(k==='app-ops'&&can(k,'r','digital')); }
function curTab(menu){ const c=SCREENS[menu]; if(!c||!c.tabs) return null; return state.tabs[menu]||c.tabs[0].key; }
function menuLabel(k,tab){
  if(tab==='digital') return '디지털 학습 앱';
  const f=findNav(k); return f?(f.item?f.item.label:f.g.sec):k;
}
function permText(menu,tab){
  const p=curPerm()[permKeyOf(menu,tab)]||'';
  const out=['c','r','u','d'].filter(function(x){ return p.indexOf(x)>=0; }).map(function(x){ return OP_LABEL[x]; });
  return out.length?out.join(' · '):'없음';
}
function firstAllowed(){
  for(const g of NAV){ if(g.flat&&canMenu(g.flat)) return g.flat; for(const i of (g.items||[])) if(canMenu(i.key)) return i.key; }
  return 'product-main';
}
function denyModal(menu,op,tab){
  const ml=menuLabel(menu,tab);
  document.getElementById('modalroot').innerHTML=`<div class="modal-dim" onclick="closeAppMenuModal()"><div class="modal sm" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
    <div class="modal-hd"><b><span class="hd-ic">${LOCK_SVG}</span>권한이 없습니다</b><span class="modal-x" onclick="closeAppMenuModal()" aria-label="닫기">&#10005;</span></div>
    <div class="modal-body">
      <p class="deny-msg"><b>${ml}</b> 메뉴의 <b>${OP_LABEL[op]}</b> 권한이 없어 진행할 수 없습니다.</p>
      <div class="deny-meta"><span>계정</span><b>${esc(curEmail())} (일반${curAccount()&&curAccount().master?' · 데모: '+esc(curPermName()||'')+' 권한 기준':''})</b><span>보유 권한</span><b>${permText(menu,tab)}</b></div>
      <div class="fhint" style="margin:0;font-size:12.5px">권한이 필요하면 마스터 관리자에게 요청해 주세요. 요청은 [계정별 권한 관리] 화면에 표시됩니다.</div>
    </div>
    <div class="modal-ft"><button class="btn btn-ghost" onclick="closeAppMenuModal()">닫기</button><button class="btn btn-primary" onclick="requestPerm('${menu}','${op}','${tab||''}')">권한 요청</button></div>
  </div></div>`;
}
function requestPerm(menu,op,tab){
  const ml=menuLabel(menu,tab||null);
  if(!PERM_REQ.some(function(r){ return r.email===curEmail()&&r.menu===ml&&r.op===OP_LABEL[op]; })) PERM_REQ.push({email:curEmail(),menu:ml,op:OP_LABEL[op],at:nowStr()});
  closeAppMenuModal();
  showToast('마스터 관리자에게 <b>'+ml+' '+OP_LABEL[op]+'</b> 권한을 요청했습니다.');
}
function donePermReq(i){ PERM_REQ.splice(i,1); render(); showToast('요청을 처리 완료로 표시했습니다.'); }
function deniedPanel(menu){
  const ml=menuLabel(menu);
  return `<div class="deny-panel"><div class="dp-ic">${LOCK_SVG}</div><h3>이 메뉴에 접근할 권한이 없습니다</h3>
    <p><b>${ml}</b> 메뉴의 조회 권한이 현재 계정(일반 권한)에 배정되어 있지 않습니다.<br>필요하면 마스터 관리자에게 권한을 요청해 주세요.</p>
    <div class="dp-act"><button class="btn btn-ghost" onclick="go('${firstAllowed()}')">접근 가능한 메뉴로 이동</button><button class="btn btn-primary" onclick="requestPerm('${menu}','r')">권한 요청</button></div></div>`;
}
function guard(menu,op,tab){ if(can(menu,op,tab)) return true; denyModal(menu,op,tab); return false; }

/* 수정 폼: 노출여부 라디오 → 노출 상태(자동) + 지금 종료/다시 노출 */
const USE_ROW_RE=/<div class="frow"><div class="flabel">노출여부<span class="req">&#9679;<\/span><\/div><div class="fbody">(<div class="radio-row">[\s\S]*?<\/div>)<div class="fhint">저장해야 반영됩니다\. \(목록의 토글은 즉시 반영\)<\/div><\/div><\/div>/;
const SLIDE_USE_RE=/<div class="frow"><div class="flabel">사용여부<span class="req">&#9679;<\/span><\/div><div class="fbody"><div class="radio-row">(?:<div class="radio-opt">[\s\S]*?<\/div>){2}<\/div><\/div><\/div>/;
function statusRow(radios){
  return `<div class="frow"><div class="flabel">노출 상태</div><div class="fbody">${radios?`<div class="hidden-field">${radios}</div>`:''}<div data-st-ctl class="st-ctl"></div><div class="fhint">노출 상태는 노출기간에 따라 자동으로 정해집니다.${radios?' 기간 중에 바로 내려야 할 때만 [지금 종료]를 사용하세요.':''}</div></div></div>`;
}
function formStatus(){
  const card=document.querySelector('.form-card'); if(!card) return null;
  const dr=card.querySelector('.daterange'); if(!dr) return null;
  const ins=dr.querySelectorAll('input:not(.dt-pick)'); if(ins.length<2) return null;
  const s=String(ins[0].value).slice(0,10), e=String(ins[1].value).slice(0,10);
  const u=card.querySelector('input[name="f-use"]:checked');
  if(u&&u.value==='0') return {k:'end',manual:true};
  const re=/^\d{4}-\d{2}-\d{2}$/;
  if(!re.test(s)||!re.test(e)) return {k:'none'};
  if(TODAY<s) return {k:'before'}; if(TODAY>e) return {k:'end'}; return {k:'ing'};
}
function refreshStatusCtl(){
  const st=formStatus(); if(!st) return;
  const ctl=document.querySelector('[data-st-ctl]');
  if(ctl){
    const hasUse=!!document.querySelector('.form-card input[name="f-use"]');
    const chip=st.k==='none'?'<span class="chip st-end">기간 미입력</span>':statusCell(st);
    const desc={ing:'노출기간 중이라 앱에 노출되고 있습니다.',before:'노출기간 시작일부터 자동으로 노출됩니다.',end:st.manual?'수동으로 종료했습니다. 노출기간과 관계없이 앱에 노출되지 않습니다.':'노출기간이 지나 노출이 끝났습니다.',none:'노출기간을 입력하면 상태가 정해집니다.'}[st.k];
    let btn='';
    if(hasUse){
      if(st.manual) btn=`<button type="button" class="btn-line" onclick="setUse(1)">다시 노출</button>`;
      else if(st.k==='ing') btn=`<button type="button" class="btn-line danger" onclick="setUse(0)">지금 종료</button>`;
      else if(st.k==='before') btn=`<button type="button" class="btn-line" onclick="setUse(0)">노출 취소</button>`;
    }
    const html=`<div class="st-ctl-row">${chip}<span class="st-desc">${desc}</span>${btn}</div>`;
    if(ctl.innerHTML!==html) ctl.innerHTML=html;
  }
  const head=document.querySelector('[data-st-head]');
  if(head&&st.k!=='none'){ const h=statusCell(st); if(head.innerHTML!==h) head.innerHTML=h; }
}
function setUse(v){
  const el=document.querySelector('.form-card input[name="f-use"][value="'+v+'"]'); if(!el) return;
  el.checked=true; markDirty(); refreshStatusCtl(); try{ liveOverlapHint({target:el}); }catch(_){}

saveAuth=function(){
  const g=function(id){ return document.getElementById(id); };

  let eid='';
  if(!id) eid='아이디(이메일)를 입력해 주세요.';
  else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(id)) eid='이메일 형식으로 입력해 주세요.';
  else if(AUTH_ACCOUNTS.some(function(a){ return a.id===id; })) eid='이미 등록된 계정입니다.';
  const enm=nm?'':'이름을 입력해 주세요.';
  g('au-err-id').innerHTML=eid; g('au-err-name').innerHTML=enm;

/* ---------- 4. 날짜 입력 YYYY-MM-DD ---------- */
const DATE_RE=/^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/, DT_RE=/^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d$/;
function maskDate(v,withTime){
  const d=String(v).replace(/\D/g,'').slice(0,withTime?12:8);
  let o=d.slice(0,4);
  if(d.length>4) o+='-'+d.slice(4,6);
  if(d.length>6) o+='-'+d.slice(6,8);
  if(withTime&&d.length>8) o+=' '+d.slice(8,10);
  if(withTime&&d.length>10) o+=':'+d.slice(10,12);
  return o;
}
function validDate(inp){
  const v=(inp.value||'').trim(); if(!v) return true;
  const t=inp.getAttribute('data-dt')==='time';
  if(!(t?DT_RE:DATE_RE).test(v)) return false;
  const p=v.slice(0,10).split('-').map(Number), dt=new Date(p[0],p[1]-1,p[2]);
  return dt.getMonth()===p[1]-1&&dt.getDate()===p[2];
}
function convertDateInput(inp){
  if(inp.getAttribute('data-dt')||inp.classList.contains('dt-pick')) return;
  const withTime=(inp.type==='datetime-local');
  const val=String(inp.value||'').replace('T',' ');
  const wrap=document.createElement('span'); wrap.className='dtw'+(withTime?' dt-time':'');
  inp.parentNode.insertBefore(wrap,inp); wrap.appendChild(inp);
  inp.type='text'; inp.value=val; inp.classList.add('dt-in');
  inp.setAttribute('data-dt',withTime?'time':'date');
  inp.setAttribute('placeholder',withTime?'YYYY-MM-DD HH:mm':'YYYY-MM-DD');
  inp.setAttribute('maxlength',withTime?'16':'10'); inp.setAttribute('inputmode','numeric'); inp.setAttribute('autocomplete','off');
  if(!inp.getAttribute('aria-label')) inp.setAttribute('aria-label',(withTime?'날짜와 시간':'날짜')+' (YYYY-MM-DD'+(withTime?' HH:mm':'')+')');
  const btn=document.createElement('button'); btn.type='button'; btn.className='dt-cal'; btn.setAttribute('aria-label','달력에서 선택'); btn.innerHTML=CAL_SVG; btn.tabIndex=-1;
  wrap.appendChild(btn);
  if(inp.disabled) btn.disabled=true;
  btn.addEventListener('click',function(){ openPicker(inp,btn,withTime); });
  inp.addEventListener('input',function(e){
    if(e&&e.inputType&&e.inputType.indexOf('delete')===0) return;
    const m=maskDate(inp.value,withTime); if(m!==inp.value) inp.value=m;
    if(validDate(inp)) inp.classList.remove('err');
  });
  inp.addEventListener('blur',function(){
    if(!validDate(inp)){ inp.classList.add('err'); showToast('날짜는 '+(withTime?'YYYY-MM-DD HH:mm':'YYYY-MM-DD')+' 형식으로 입력해 주세요. (예: 2026-10-12'+(withTime?' 09:00':'')+')'); }
  });
}
/* 달력: 화면에 하나만 두는 숨김 선택기 (폼 입력 개수에 영향 없음) */
function openPicker(inp,btn,withTime){
  const id=withTime?'dt-pick-t':'dt-pick-d';
  let pick=document.getElementById(id);
  if(!pick){
    pick=document.createElement('input'); pick.id=id; pick.type=withTime?'datetime-local':'date'; pick.className='dt-pick'; pick.tabIndex=-1; pick.setAttribute('aria-hidden','true');
    document.body.appendChild(pick);
    pick.addEventListener('change',function(){
      const t=pick._target; if(!t||!pick.value) return;
      t.value=(pick.getAttribute('type')==='datetime-local')?pick.value.replace('T',' '):pick.value;
      t.classList.remove('err');
      t.dispatchEvent(new Event('input',{bubbles:true}));
      t.dispatchEvent(new Event('change',{bubbles:true}));
    });
  }
  const r=btn.getBoundingClientRect();
  pick.style.left=r.left+'px'; pick.style.top=r.bottom+'px';
  pick._target=inp;
  const v=(inp.value||'').trim();
  pick.value=withTime?(DT_RE.test(v)?v.replace(' ','T'):''):(DATE_RE.test(v)?v:'');
  try{ pick.showPicker(); }catch(_){ inp.focus(); }
}

}

function pfLearnVal(){ const c=document.querySelector('input[name="f-learn"]:checked'); return c?c.value:'book'; }
function pfBookish(v){ return v==='book'||v==='mix'; }
function pfLearn(v){
  document.querySelectorAll('.pf-card[data-l]').forEach(function(c){ c.classList.toggle('on',c.getAttribute('data-l')===v); });
  const bk=pfBookish(v), t=function(id,hide){ const e=document.getElementById(id); if(e) e.classList.toggle('hidden-field',hide); };
  t('pf-book-res',!bk); t('pf-digi',v==='book'); t('pf-hall',!bk);
  const st=document.querySelector('input[name="f-study"]:checked'); pfStudy(st?st.value:'0');
}
function pfLearnPick(v){
  const r=document.querySelector('input[name="f-learn"][value="'+v+'"]');
  if(!r||r.disabled) return;
  if(!r.checked){ r.checked=true; r.dispatchEvent(new Event('change',{bubbles:true})); }
}
function pfMapping(r){
  if(r.code==='AQ') return [['AQ','눈높이사고력코딩1','병행'],['AQB','눈높이사고력코딩','주1회'],['AQD','눈높이사고력코딩1','단독']];
  const suf=['','B','D','E','F','G','H','J','K','L','N','P'];
  const kind=['병행','주1회','단독'];
  const out=[]; for(let i=0;i<r.cnt;i++) out.push([r.code+suf[i],r.name+(r.cnt>1?' '+(i+1)+'단계':''),kind[i%3]]);
  return out;
}
function pfSec(id,title,desc,badge,body){
  return `<section class="pf-sec" id="${id}"><header class="pf-h"><div><h3>${title}${badge||''}</h3><p>${desc}</p></div></header><div class="pf-b">${body}</div></section>`;
}
function pfPlatform(v){
  document.querySelectorAll('.pf-card[data-p]').forEach(function(c){ c.classList.toggle('on',c.getAttribute('data-p')===v); });
  const app=document.getElementById('pf-os-app'), web=document.getElementById('pf-os-web');
  if(app) app.classList.toggle('hidden-field',v!=='app');
  if(web) web.classList.toggle('hidden-field',v==='app');
  const pa=document.getElementById('pf-papi-row'); if(pa) pa.classList.toggle('hidden-field',v!=='plink');
  const lab=document.getElementById('pf-os-lab');
  if(lab) lab.textContent=(v==='app')?'앱을 선택해 iOS·AOS 정보를 입력합니다.':(v==='webview'?'웹뷰를 선택해 WEB 정보와 화면 방향을 입력합니다.':'개인화 링크를 선택해 WEB URL과 개인화 API를 입력합니다.');
}
function pfStudy(v){
  const on=(String(v)==='1');

  if(n) n.classList.toggle('hidden-field',!show);

}

const _upFile8=upFile;
upFile=function(id,file){
  const el=document.getElementById(id);
  if(el&&el.getAttribute('data-types')==='json'){
    if(!file) return;
    if(!/\.json$/i.test(file.name)&&file.type!=='application/json'){ setErr(el,'JSON 파일만 등록할 수 있습니다.'); return; }
    upApply(id,{name:file.name}); return;
  }
  _upFile8(id,file);
};

  card.insertAdjacentHTML('beforebegin','<div id="batch-bar" class="batch-bar" role="toolbar" aria-label="선택 항목 일괄 처리"></div>');
  batchBar();
}
const _r34=render;
render=function(){ if(state.sel&&state.sel.menu&&state.sel.menu!==state.menu) state.sel={menu:null,keys:[]}; const x=_r34.apply(this,arguments); try{ permRoles(); batchInject(); }catch(e){ console.error(e); } return x; };
render();

/* =====================================================================
   v35 · 권한 3종: 마스터 관리자(전체) · 일반 관리자(선택한 메뉴 관리) · 뷰어(전체 조회만)
   ===================================================================== */
const ROLES=[['master','마스터 관리자','모든 메뉴의 모든 권한'],['general','일반 관리자','선택한 메뉴만 등록·조회·수정·삭제'],['viewer','뷰어','모든 메뉴 조회만 (계정/권한 관리 제외)']];
const ROLE_NAME={master:'마스터 관리자',general:'일반 관리자',viewer:'뷰어'};
function permOfRole(role,menus){ const p={}; PERM_MENUS.forEach(function(m){ p[m[0]]=role==='viewer'?(m[0]==='auth'?'':'r'):(role==='general'&&menus&&menus.indexOf(m[0])>=0?'crud':''); }); return p; }
function accRole(a){ if(a.master) return 'master'; if(a.role) return a.role; const p=a.perm||{}; return PERM_MENUS.some(function(m){ return /[cud]/.test(p[m[0]]||''); })?'general':'viewer'; }
function accMenus(a){ const p=a.perm||{}; return PERM_MENUS.filter(function(m){ return /[cud]/.test(p[m[0]]||''); }).map(function(m){ return m[0]; }); }
/* 기존 계정 정규화: 일반 관리자는 관리 메뉴 전체 권한으로 */
AUTH_ACCOUNTS.forEach(function(a){ const r=accRole(a); a.role=r; if(r==='general') a.perm=permOfRole('general',accMenus(a)); if(r==='viewer') a.perm=permOfRole('viewer'); });
roleOf=function(a){ return ROLE_NAME[accRole(a)]; };
permRoles=function(){};
state.permDraft={};
function draftOf(ai){ const a=AUTH_ACCOUNTS[ai]; return state.permDraft[ai]||{role:accRole(a),menus:accMenus(a)}; }
function setDraftRole(ai,role){ const d=draftOf(ai); state.permDraft[ai]={role:role,menus:role==='general'?(d.menus.length?d.menus:[]):[]}; render(); }
function setDraftMenu(ai,m,on){ const d=draftOf(ai); const ms=d.menus.slice(); const i=ms.indexOf(m); if(on&&i<0) ms.push(m); if(!on&&i>=0) ms.splice(i,1); state.permDraft[ai]={role:'general',menus:ms}; render(); }
savePermRow=function(ai){
  if(!guard('auth-perm','u')) return;
  const a=AUTH_ACCOUNTS[ai], d=draftOf(ai), before=ROLE_NAME[accRole(a)];
  if(d.role==='general'&&!d.menus.length){ showToast('일반 관리자는 관리할 메뉴를 하나 이상 선택해 주세요.'); return; }
  a.role=d.role; a.master=d.role==='master'; a.perm=d.role==='master'?undefined:permOfRole(d.role,d.menus);
  delete state.permDraft[ai];
  const menus=d.role==='general'?' ('+d.menus.map(function(k){ return (PERM_MENUS.find(function(m){ return m[0]===k; })||[0,k])[1]; }).join(', ')+')':'';
  AUTH_LOGS.unshift([nowStr(),curName(),navPath('auth-perm'),'수정',a.name+' 계정 권한 '+before+' → '+ROLE_NAME[d.role]+menus]);
  renderSidebar(); render(); showToast(a.name+' 계정 권한을 저장했습니다.');
};
authPermBody=function(){
  const me=curEmail();
  const head=`<tr><th>아이디</th><th>이름</th><th style="width:150px">권한</th>${PERM_MENUS.map(function(m){ return `<th style="text-align:center">${m[1]}</th>`; }).join('')}<th style="text-align:center;width:80px">저장</th></tr>`;
  const rows=AUTH_ACCOUNTS.map(function(a,ai){
    const d=draftOf(ai), dirty=!!state.permDraft[ai], self=a.id===me;
    const sel=`<select class="ddl role-sel" ${self||a.disabled?'disabled':''} onchange="setDraftRole(${ai},this.value)">${ROLES.map(function(r){ return `<option value="${r[0]}" ${r[0]===d.role?'selected':''}>${r[1]}</option>`; }).join('')}</select>`;
    const cells=PERM_MENUS.map(function(m){
      if(d.role==='master') return '<td style="text-align:center"><span class="pv all">전체</span></td>';
      if(d.role==='viewer') return `<td style="text-align:center">${m[0]==='auth'?'<span class="pv none">-</span>':'<span class="pv ro">조회</span>'}</td>`;
      const on=d.menus.indexOf(m[0])>=0;
      return `<td style="text-align:center"><label class="pv-chk ${on?'on':''}"><input type="checkbox" ${on?'checked':''} ${a.disabled?'disabled':''} onchange="setDraftMenu(${ai},'${m[0]}',this.checked)">관리</label></td>`;
    }).join('');
    return `<tr class="${dirty?'row-dirty':''}"><td>${a.id}</td><td style="white-space:nowrap">${a.name}</td><td>${sel}</td>${cells}<td style="text-align:center">${self?'<span style="color:#A3ABB6">-</span>':`<button class="btn-line" ${dirty?'':'disabled'} onclick="savePermRow(${ai})">저장</button>`}</td></tr>`;
  }).join('');
  return reqCard()+`<table class="gt perm">${'<thead>'+head+'</thead>'}<tbody>${rows}</tbody></table>`;
};
(function(){ const s=SCREENS['auth-perm']; s.render=function(){ return cardify(authPermBody(),{title:'계정별 권한',actions:'<button class="btn btn-primary" onclick="openModal()">+ 등록</button>'}); }; s.card=false; })();
/* 신규 등록 팝업 */
authModal=function(){
  return `<div class="modal-dim" onclick="closeModal()"><div class="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
    <div class="modal-hd"><b>계정 권한 등록</b><span class="modal-x" onclick="closeModal()" aria-label="닫기">&#10005;</span></div>
    <div class="modal-body">
      <div class="ff mb"><label for="au-id">아이디(이메일) <span style="color:#D33A3A">*</span></label><input id="au-id" type="text" placeholder="예 : chungho_choi@daekyo.co.kr" style="width:100%"><div class="field-err" id="au-err-id"></div></div>
      <div class="ff mb"><label for="au-name">이름 <span style="color:#D33A3A">*</span></label><input id="au-name" type="text" placeholder="예 : 최충호" style="width:100%"><div class="field-err" id="au-err-name"></div></div>
      <div class="ff mb"><label>권한 <span style="color:#D33A3A">*</span></label><div class="role-cards">${ROLES.map(function(r,i){ return `<label class="role-card ${i===1?'on':''}"><input type="radio" name="au-role" value="${r[0]}" ${i===1?'checked':''} onchange="auRole(this.value)"><b>${r[1]}</b><span>${r[2]}</span></label>`; }).join('')}</div></div>
      <div class="ff" id="au-menus"><label>관리할 메뉴 <span style="color:#D33A3A">*</span></label><div class="au-menus">${PERM_MENUS.map(function(m){ return `<label class="pv-chk"><input type="checkbox" class="au-m" value="${m[0]}" onchange="this.parentNode.classList.toggle('on',this.checked)">${esc(m[1])}</label>`; }).join('')}</div><div class="field-err" id="au-err-m"></div></div>
    </div>
    <div class="modal-ft"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-primary" onclick="saveAuth()">등록</button></div>
  </div></div>`;
};
SCREENS['auth-perm'].modal=authModal;
function auRole(v){ document.querySelectorAll('.role-card').forEach(function(c){ c.classList.toggle('on',c.querySelector('input').value===v); }); const m=document.getElementById('au-menus'); if(m) m.style.display=v==='general'?'':'none'; }
saveAuth=function(){
  const g=function(id){ return document.getElementById(id); };
  const id=g('au-id').value.trim(), nm=g('au-name').value.trim(), role=(document.querySelector('input[name="au-role"]:checked')||{}).value||'general';
  const menus=[...document.querySelectorAll('.au-m:checked')].map(function(c){ return c.value; });
  let eid=''; if(!id) eid='아이디(이메일)를 입력해 주세요.'; else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(id)) eid='이메일 형식으로 입력해 주세요.'; else if(AUTH_ACCOUNTS.some(function(a){ return a.id===id; })) eid='이미 등록된 계정입니다.';
  const enm=nm?'':'이름을 입력해 주세요.', em=(role==='general'&&!menus.length)?'관리할 메뉴를 하나 이상 선택해 주세요.':'';
  g('au-err-id').textContent=eid; g('au-err-name').textContent=enm; g('au-err-m').textContent=em;
  if(eid||enm||em) return;
  AUTH_ACCOUNTS.push(role==='master'?{id:id,name:nm,master:true,role:'master'}:{id:id,name:nm,role:role,perm:permOfRole(role,menus)});
  const ri=AUTH_REQUESTS.findIndex(function(r){ return r.email===id; }); if(ri>=0) AUTH_REQUESTS.splice(ri,1);
  AUTH_LOGS.unshift([nowStr(),curName(),navPath('auth-perm'),'등록',nm+' 계정 등록 ('+ROLE_NAME[role]+')']);
  closeModal(); showToast(nm+' 계정을 '+ROLE_NAME[role]+'(으)로 등록했습니다.');
};
PAGE_TIP['auth-perm']='마스터 관리자: 모든 메뉴의 모든 권한 · 일반 관리자: 선택한 메뉴만 관리(등록·조회·수정·삭제) · 뷰어: 모든 메뉴 조회만 (계정/권한 관리 제외). 처음 로그인하는 계정은 [+ 등록]으로 미리 등록합니다.';
render();

permLabelHtml=function(m){ const t=[m[2]?'포함 메뉴: '+m[2].join(' · '):'',m[3]||''].filter(Boolean).join(' / '); return `<span class="pm-name">${esc(m[1])}${t?tipHtml(t):''}</span>`; };
