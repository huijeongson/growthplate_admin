<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원성장판 어드민 · 최종 IA 프로토타입 v3 (협의용)</title>
<style>
  :root{
    --topbar:#0d0f12;
    --sidebar:#ffffff;
    --sidebar-line:#e7e9ec;
    --content:#f7f8fa;
    --line:#e5e8ec;
    --ink:#20242b;
    --ink-2:#6b7280;
    --ink-3:#9aa1ab;
    --green:#178a4c;
    --green-bg:#eaf7f0;
    --blue:#2f5fdb;
    --blue-bg:#eef2fe;
    --navy:#37415c;
    --navy-dk:#2b3348;
    --grey-btn:#5b6472;
    --grey-btn-dk:#4a525f;
    --ghost:#eef1f4;
    --danger:#d64545;
    --radius:4px;
    --shadow:0 1px 2px rgba(20,20,30,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    background:#dfe2e7;color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}

  .doc-head{max-width:1180px;margin:0 auto;padding:22px 20px 4px}
  .doc-tag{display:inline-block;font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--green);
    background:var(--green-bg);border:1px solid #cdeada;padding:4px 10px;border-radius:999px;margin-bottom:9px}
  .doc-head h1{font-size:19px;font-weight:800;letter-spacing:-.01em;color:#14181f}
  .doc-head p{font-size:12.5px;color:#6b7280;margin-top:6px;line-height:1.6;max-width:820px}

  .frame{max-width:1180px;margin:16px auto 60px;border-radius:8px;overflow:hidden;
    box-shadow:0 18px 46px rgba(20,25,35,.22);border:1px solid #14161a}

  /* Retool top chrome */
  .topbar{background:var(--topbar);color:#e9eaee;display:flex;align-items:center;
    padding:0 14px;height:38px;gap:10px}
  .topbar .app-id{font-size:12.5px;font-weight:700;color:#f2f3f5;display:flex;align-items:center;gap:6px}
  .topbar .app-id .star{color:#565b66;font-size:12px}
  .topbar .tabs{display:flex;gap:14px;margin-left:14px;font-size:11.5px;color:#9096a1}
  .topbar .tabs span:first-child{color:#e9eaee}
  .topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .topbar .btn-share{font-size:12px;color:#e9eaee;border:1px solid #3a3f47;padding:5px 12px;border-radius:6px}
  .topbar .btn-edit{font-size:12px;color:#fff;background:#2f6fed;padding:5px 12px;border-radius:6px;font-weight:600}

  .shell{display:flex;background:var(--content);min-height:660px}

  /* Sidebar */
  .sidebar{width:256px;flex:0 0 256px;background:var(--sidebar);border-right:1px solid var(--sidebar-line);
    padding:16px 0 10px;overflow-y:auto}
  .who{display:flex;align-items:center;gap:9px;padding:0 16px 16px;border-bottom:1px solid var(--sidebar-line);margin-bottom:8px}
  .who .av{width:30px;height:30px;border-radius:50%;background:#f6d9b8;color:#a5651f;font-weight:700;
    font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .who .nm{font-size:12.5px;font-weight:700;color:#20242b}
  .who .em{font-size:10.5px;color:#9aa1ab;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}

  .grp{border-bottom:1px solid #f1f2f4}
  .grp>.gh{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
    font-size:13px;font-weight:600;color:#3c414b;cursor:pointer;user-select:none}
  .grp>.gh:hover{background:#f7f8fa}
  .grp>.gh .car{font-size:10px;color:#b6bbc3;transition:.15s}
  .grp.open>.gh .car{transform:rotate(90deg)}
  .grp .sub{display:none;padding-bottom:4px}
  .grp.open .sub{display:block}
  .sub .item{display:block;padding:8px 16px 8px 30px;font-size:12.5px;color:#5e6570;cursor:pointer;
    border-left:2px solid transparent}
  .sub .item:hover{background:#f7f8fa}
  .sub .item.on{color:var(--green);background:var(--green-bg);border-left-color:var(--green);font-weight:700}
  .sub .item.disabled{color:#c7cbd2;cursor:default}
  .flat-item{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-size:13px;
    font-weight:600;color:#3c414b;cursor:pointer}
  .flat-item:hover{background:#f7f8fa}
  .flat-item .car{font-size:10px;color:#b6bbc3}
  .flat-item.leaf.on{color:var(--green);background:var(--green-bg)}

  .sub-divider{margin:10px 16px 2px 30px;padding-top:8px;border-top:1px dashed #e7e9ec;
    font-size:10px;font-weight:800;letter-spacing:.04em;color:#c47a1c}
  .item-warn{color:#a85a1a}
  .item-warn:not(.on){background:#fff9f0}
  .new-tag{display:inline-block;margin-left:6px;font-size:9.5px;font-weight:800;color:#c2660c;
    background:#fdecd2;border-radius:999px;padding:1px 7px;vertical-align:middle}

  .tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .tabbar .tab{padding:10px 16px;font-size:13px;font-weight:700;color:#9aa1ab;cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabbar .tab.active{color:var(--ink);border-bottom-color:var(--blue)}
  .tabbar .tab:hover{color:#3c414b}

  /* Main content */
  .main{flex:1;min-width:0;padding:26px 30px 40px;overflow-x:auto}
  .crumb{font-size:12px;color:#9aa1ab;margin-bottom:6px}
  .crumb b{color:#5e6570;font-weight:600}
  h2.pagetitle{font-size:23px;font-weight:800;letter-spacing:-.01em;color:#14181f;margin:0 0 18px}

  /* list toolbar */
  .toolbar{display:flex;align-items:center;justify-content:flex-end;gap:16px;margin-bottom:12px;flex-wrap:wrap}
  .toolbar .filters{display:flex;gap:14px;align-items:center;font-size:12.5px;color:#4b5158;margin-right:auto}
  .toolbar .filters label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .toolbar .filters input[type=checkbox]{width:14px;height:14px;accent-color:var(--blue)}
  .searchbox{display:flex}
  .searchbox input{border:1px solid var(--line);border-right:none;border-radius:5px 0 0 5px;
    padding:7px 10px;font-size:12.5px;font-family:inherit;width:210px;background:#fff}
  .searchbox button{border:none;border-radius:0 5px 5px 0;background:#2f6fed;color:#fff;font-weight:600;
    font-size:12.5px;padding:7px 16px;cursor:pointer}

  table.gt{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:6px;
    overflow:hidden;box-shadow:var(--shadow)}
  table.gt thead th{background:#f6f7f9;text-align:left;font-size:11.5px;font-weight:700;color:#5e6570;
    padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.gt thead th.sort{cursor:pointer}
  table.gt thead th.sort:after{content:" ▾";color:#b6bbc3;font-size:9px}
  table.gt tbody td{padding:11px 14px;border-bottom:1px solid #eef0f2;font-size:12.5px;color:#3c414b;vertical-align:middle}
  table.gt tbody tr:last-child td{border-bottom:none}
  table.gt tbody tr:hover{background:#fafbfc}
  table.gt a.rowlink{color:var(--blue);text-decoration:underline;cursor:pointer;font-weight:500}
  .thumb{width:52px;height:38px;border-radius:5px;object-fit:cover;display:block;background:#eef0f2}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .pill.on{color:#178a4c;background:#eaf7f0}
  .pill.off{color:#9aa1ab;background:#f1f2f4}

  .listfoot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .listfoot .count{font-size:12px;color:#9aa1ab}
  .listfoot .pager{font-size:12px;color:#5e6570;display:flex;align-items:center;gap:8px}
  .listfoot .pager span.pg{border:1px solid var(--line);border-radius:4px;padding:3px 10px;background:#fff}
  .listfoot .actions{display:flex;gap:8px}
  .btn{border:none;font-family:inherit;font-size:12.5px;font-weight:700;border-radius:6px;padding:9px 18px;cursor:pointer}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-primary:hover{background:var(--navy-dk)}
  .btn-grey{background:var(--grey-btn);color:#fff}
  .btn-grey:hover{background:var(--grey-btn-dk)}
  .btn-ghost{background:var(--ghost);color:#4b5158}
  .btn-ghost:hover{background:#e4e7ea}

  /* edit form */
  .form-card{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
  .form-section-title{padding:16px 22px;font-size:14.5px;font-weight:800;border-bottom:1px solid var(--line);color:#14181f}
  .frow{display:flex;gap:26px;padding:20px 22px;border-bottom:1px solid var(--line)}
  .frow:last-child{border-bottom:none}
  .flabel{width:120px;flex:0 0 120px;font-size:13px;font-weight:700;color:#20242b;display:flex;align-items:flex-start;gap:3px;padding-top:9px}
  .flabel .req{color:#e0524c;font-size:10px;line-height:1}
  .fbody{flex:1;min-width:0}
  .fbody input[type=text],.fbody input[type=number],.fbody textarea,.fbody select{
    width:100%;border:1px solid #d7dbe0;border-radius:5px;padding:9px 11px;font-size:13px;font-family:inherit;background:#fff}
  .fbody input:focus,.fbody textarea:focus,.fbody select:focus{outline:none;border-color:var(--blue)}
  .fbody textarea{resize:vertical;min-height:56px}
  .fhint{font-size:11px;color:#9aa1ab;margin-top:6px}
  .fnote-list{font-size:11.5px;color:#8990a0;margin-top:8px;line-height:1.7;padding-left:14px}
  .fnote-list li{list-style:disc}
  .hrow{display:flex;gap:10px;align-items:center}
  .datebox{display:flex;align-items:center;gap:8px;border:1px solid #d7dbe0;border-radius:5px;padding:9px 11px;
    font-size:13px;color:#3c414b;background:#fff}
  .datebox .ic{color:#9aa1ab}
  .radio-row{display:flex;gap:26px;align-items:center}
  .radio-opt{display:flex;align-items:center;gap:7px;font-size:13px;color:#3c414b;cursor:pointer}
  .rb{width:16px;height:16px;border-radius:50%;border:1.6px solid #ccd1d9;flex:0 0 auto;display:flex;
    align-items:center;justify-content:center}
  .rb.sel{border-color:var(--blue)}
  .rb.sel:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue)}
  .up-box{border:1.4px dashed #d7dbe0;border-radius:8px;padding:16px;display:flex;gap:16px;align-items:flex-start;background:#fbfbfc}
  .up-box .prev{width:170px;flex:0 0 auto;border-radius:6px;overflow:hidden;background:#eee}
  .up-box .prev img{width:100%;display:block}
  .up-box .cancel{display:flex;align-items:center;gap:6px;font-size:12px;color:#8990a0;margin-bottom:8px;cursor:pointer}
  .findbtn{border:1px solid #d7dbe0;background:#fff;border-radius:5px;padding:9px 14px;font-size:12.5px;
    color:#3c414b;cursor:pointer;white-space:nowrap}
  .findbtn.dark{background:var(--grey-btn);color:#fff;border:none}
  .toggle-tabs{display:flex;gap:18px;margin-bottom:10px;font-size:12.5px;color:#5e6570}
  .rte-toolbar{display:flex;gap:8px;align-items:center;border:1px solid #d7dbe0;border-bottom:none;
    border-radius:6px 6px 0 0;padding:8px 10px;background:#fafbfc;flex-wrap:wrap}
  .rte-toolbar select{width:auto;padding:4px 6px;font-size:12px}
  .rte-toolbar .ric{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:4px;
    color:#5e6570;font-size:13px;cursor:default}
  .rte-body{border:1px solid #d7dbe0;border-top:none;border-radius:0 0 6px 6px;padding:0;overflow:hidden;background:#25292f}
  .rte-body .mock{padding:22px 20px;color:#e9eaee}
  .rte-body .mock .mtop{display:flex;justify-content:space-between;font-size:13px;margin-bottom:16px;color:#dfe1e4}
  .rte-body .mock h4{font-size:17px;font-weight:800;line-height:1.4;margin:0}
  .rte-body .mock small{display:block;font-size:12px;font-weight:500;color:#a9afb8;margin-top:5px}

  .msg-row{display:flex;gap:8px;margin-bottom:8px}
  .msg-row input{flex:1}
  .del-btn{background:var(--grey-btn);color:#fff;border:none;border-radius:5px;padding:9px 14px;font-size:12.5px;cursor:pointer}
  .add-btn{background:var(--navy);color:#fff;border:none;border-radius:5px;padding:8px 16px;font-size:12.5px;
    font-weight:700;cursor:pointer}

  /* slide-menu builder table */
  .sm-block{border-bottom:1px solid var(--line)}
  .sm-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line)}
  .sm-head h3{font-size:15px;font-weight:800}
  .sm-table{width:100%;border-collapse:collapse}
  .sm-table th{background:#f6f7f9;font-size:11px;font-weight:700;color:#5e6570;padding:9px 14px;text-align:left;
    border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
  .sm-table td{padding:14px;border-bottom:1px solid #eef0f2;vertical-align:top;font-size:12.5px}
  .sm-order{display:flex;flex-direction:column;align-items:center;gap:4px;color:#b6bbc3;font-size:13px}
  .sm-icon-row{display:flex;align-items:center;gap:10px;margin-top:8px}
  .sm-icon-row .ic{width:32px;height:32px;border-radius:7px;background:#eef0f2;display:flex;align-items:center;
    justify-content:center;font-size:15px;color:#178a4c}
  .sm-icon-row .x{color:#c7cbd2;font-size:13px;cursor:default}
  .sm-mini{font-size:10.5px;color:#9aa1ab;margin-top:4px}
  .sm-shortcut-field{margin-bottom:10px}
  .sm-shortcut-field label{display:block;font-size:11.5px;color:#5e6570;font-weight:600;margin-bottom:4px}
  .sm-shortcut-field .val{font-size:12px;color:#3c414b;border:1px solid #e4e7ea;border-radius:5px;padding:7px 9px;background:#fbfbfc}

  .form-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--line);background:#fbfbfc}

  .placeholder-panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:60px 20px;text-align:center;color:#9aa1ab;font-size:13px}

  .count-line{font-size:14px;color:#20242b;font-weight:800;margin-bottom:12px}
  select.ddl{border:1px solid var(--line);border-radius:5px;padding:7px 10px;font-size:12.5px;background:#fff;font-family:inherit}
  .toolbar2{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .toolbar2 .left{margin-right:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:#4b5158}
  .toolbar2 .left label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .toolbar2 .left input[type=checkbox]{width:14px;height:14px;accent-color:var(--blue)}
  .listfoot2{display:flex;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap;gap:10px}
  .listfoot2 .side{display:flex;align-items:center;gap:10px}
  .sync-label{font-size:12.5px;font-weight:700;color:#3c414b}
  .icon-actions{display:flex;gap:6px;color:#9aa1ab;font-size:13px}
  .badge-swatch{width:44px;height:44px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
  .tiny-x{color:#c7cbd2;font-size:11px;margin-left:5px}
  .warn-box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:38px 20px;text-align:center;margin-bottom:22px}
  .warn-box .msg{color:#d64545;font-weight:700;font-size:13.5px;margin-bottom:18px;line-height:1.6}
  .section-title2{font-size:16px;font-weight:800;margin:22px 0 12px;color:#14181f}
  .tag-chip{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;margin:0 6px 6px 0}
  .note-orange{color:#c47a1c;font-size:12.5px;font-weight:600;margin-bottom:14px}
  .sm-standalone .sm-block{border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:var(--shadow);margin-bottom:0}
  .code-box{border:1px solid #d7dbe0;border-radius:5px;padding:9px 11px;font-size:13px;background:#f6f7f9;color:#8990a0}

  .tabbar{overflow-x:auto}
  .tabbar .tab{white-space:nowrap}
  .tab.warn{color:#c47a1c}
  .tab.warn.active{color:#a85a1a;border-bottom-color:#e0a13a}
  .tab-chip{margin-left:6px;font-size:9.5px;font-weight:800;color:#3f5f94;background:#e6eefb;border-radius:999px;padding:1px 7px}
  .new-tag.gray{color:#5e6570;background:#eceff3}
  .ro-note{background:#f3f6fb;border:1px solid #dbe5f5;color:#3f5f94;font-size:12px;padding:9px 12px;border-radius:6px;margin-bottom:14px}

  /* ===== v3: 뉴드림스 어드민 방향 (다크 사이드바 · 카드형 · 안내 배너) ===== */
  :root{--blue:#2f4cc7;--navy:#2f4cc7;--navy-dk:#2640aa;--line:#e5e7eb}
  body{background:#f3f4f6;color:#1f2937}
  .app{display:flex;height:100vh;min-height:620px}
  .nav{width:250px;flex:0 0 250px;background:#1b2238;color:#aab3cc;display:flex;flex-direction:column;overflow-y:auto}
  .nav-brand{padding:20px 18px 18px;font-size:16px;font-weight:800;color:#fff}
  .nav-brand span{color:#7f9bff}
  .nav-sec{padding:14px 18px 8px;font-size:13px;font-weight:700;color:#e4e8f5;border-top:1px solid rgba(255,255,255,.08)}
  .nav-item{display:flex;align-items:center;flex-wrap:wrap;gap:2px;padding:9px 16px 9px 22px;font-size:13px;color:#aab3cc;cursor:pointer;border-left:3px solid transparent}
  .nav-item:before{content:"\2022";margin-right:7px}
  .nav-item:hover{background:rgba(255,255,255,.04)}
  .nav-item.on{background:rgba(255,255,255,.09);color:#fff;font-weight:700;border-left-color:#6f8cff}
  .nav-item .new-tag.gray{background:rgba(255,255,255,.14);color:#c9d0e4}
  .nav-foot{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;line-height:1.7;color:#7f89a6}
  .workarea{flex:1;min-width:0;display:flex;flex-direction:column}
  .crumbbar{height:44px;flex:0 0 44px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:6px;padding:0 24px;font-size:12px;color:#6b7280}
  .crumbbar b{color:#111827;font-weight:700}
  .crumbbar .user{margin-left:auto}
  .main{flex:1;min-width:0;overflow:auto;padding:26px 28px 56px;background:#f3f4f6}
  h2.pagetitle{font-size:20px;font-weight:800;margin:0 0 6px;color:#111827;display:flex;align-items:center;gap:4px}
  .pagedesc{font-size:13px;color:#6b7280;margin:0 0 16px;line-height:1.55}
  .backlink{display:inline-block;color:#2f4cc7;font-size:12.5px;cursor:pointer;margin-bottom:10px}
  .note-amber,.note-orange{background:#fff8eb;border:1px solid #f5dcae;color:#b45309;border-radius:8px;padding:11px 14px;font-size:12.5px;margin:0 0 16px;font-weight:500;line-height:1.55}
  .note-amber b{color:#92400e}
  .tcard{background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 1px 2px rgba(16,24,40,.04);margin-bottom:12px;overflow:hidden}
  .thead{display:flex;align-items:center;gap:10px;padding:14px 18px;font-weight:700;font-size:14px;color:#111827}
  .thead .ta{margin-left:auto;display:flex;align-items:center;gap:8px}
  .thead .btn{padding:7px 12px}
  .tscroll{overflow-x:auto}
  .tcard table.gt{border:none;box-shadow:none;border-radius:0;min-width:100%}
  table.gt thead th{background:#fff;color:#6b7280;font-weight:600;font-size:12px;border-top:1px solid #eef0f3}
  table.gt a.rowlink{text-decoration:none;color:#2f4cc7;font-weight:600}
  .btn-line{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;color:#374151;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn-line:hover{background:#f9fafb}
  .btn-primary,.btn-grey{background:#2f4cc7;color:#fff}
  .btn-primary:hover,.btn-grey:hover{background:#2640aa}
  .btn-ghost{background:#fff;border:1px solid #d1d5db;color:#374151}
  .toolbar,.toolbar2,.fcard{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px 18px;margin-bottom:14px}
  .searchbox button{background:#2f4cc7}
  .count-line{display:none}
  .form-card{border-radius:10px;border:1px solid #e5e7eb;margin-top:14px}
  .flabel .req{font-size:0}
  .flabel .req:after{content:"*";font-size:14px;color:#e0524c}

function findNav(menuKey){
  if(menuKey==='home') return {g:{sec:'홈'},gi:-1,item:null,ii:-1,home:true};
  for(let gi=0;gi<NAV.length;gi++){
    const g=NAV[gi];
    if(g.flat===menuKey) return {g,gi,item:null,ii:-1};
    const its=g.items||[];
    for(let ii=0;ii<its.length;ii++){ if(its[ii].key===menuKey) return {g,gi,item:its[ii],ii}; }
  }
  return null;
}

function renderSidebar(){
  const el=document.getElementById('sidebar');
  let html=`<div class="nav-brand" style="cursor:pointer" onclick="go('home')">회원성장판 <span>어드민</span></div><div class="nav-sec nav-link ${state.menu==='home'?'on':''}" onclick="go('home')">홈</div>`;
  NAV.forEach(g=>{
    if(g.flat){ html+=`<div class="nav-sec nav-link ${state.menu===g.flat?'on':''}" onclick="go('${g.flat}')">${g.sec}</div>`; return; }
    html+=`<div class="nav-sec">${g.sec}</div>`;
    g.items.forEach(i=>{
      html+=`<div class="nav-item ${state.menu===i.key?'on':''}" onclick="go('${i.key}')">${i.label}${i.isNew?'<span class="new-tag">신규</span>':''}${i.tag?`<span class="new-tag gray">${i.tag}</span>`:''}</div>`;
    });
  });
  html+=`<div class="nav-foot">프로토타입 · 최종 IA (협의용)<br>로그아웃${roleSwitchHtml()}</div>`;
  el.innerHTML=html;
}

}

/* ---------------- Generic list renderer ---------------- */
function renderListGeneric(cfg, opts){
  opts = opts||{};
  const filters = opts.filters!==false;
  const search = opts.search!==false;
  let filterHtml = filters ? `
    <div class="filters">
      <label><input type="checkbox"> 노출 예정</label>
      <label><input type="checkbox" ${opts.checkedMid?'checked':''}> 노출 중</label>
      <label><input type="checkbox"> 노출 종료</label>
    </div>` : `<div class="filters">${opts.checkboxLabel?`<label><input type="checkbox" checked> ${opts.checkboxLabel}</label>`:''}</div>`;

  let rowsHtml = cfg.rows.map(r=>{
    return `<tr>${r._cells(r)}</tr>`;
  }).join('');

  return `
    <div class="crumb">${cfg.crumb.map((c,i)=>`<b>${c}</b>`).join(' &#8250; ')}</div>
    <h2 class="pagetitle">${cfg.title}</h2>
    ${(filters||opts.checkboxLabel||search)?`<div class="toolbar">
      ${filterHtml}
      ${search?`<div class="searchbox"><input placeholder="검색어를 입력하세요."><button>검색</button></div>`:''}
    </div>`:''}
    <table class="gt">
      <thead><tr>${cfg.columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <div class="listfoot">
      <div class="count">Showing 1-${cfg.rows.length} of ${cfg.rows.length}</div>
      <div class="pager"><span>&#8249;</span><span class="pg">1</span> of 1 <span>&#8250;</span></div>
      <div class="actions">${(cfg.listActions||[]).map(a=>`<button class="btn ${a==='등록'?'btn-primary':'btn-ghost'}" onclick="${a==='등록'?'alert(\'등록 화면은 이번 프로토타입 범위에 포함되어 있지 않습니다.\')':''}">${a}</button>`).join('')}</div>
    </div>
  `;
}

function thumbCell(color){
  return `<td><div class="thumb" style="background:${color}"></div></td>`;
}
function pillCell(on){
  return `<td><span class="pill ${on?'on':'off'}">${on?'사용':'미사용'}</span></td>`;
}

/* ---------------- Banner list screens ---------------- */
function bannerList(key){
  const cfg = banners[key];
  cfg.rows.forEach(r=>{
    r._cells = (row)=>{
      let cells = '';
      if(key==='login') cells += `<td>${row.ord}</td>`;
      if(key==='list') cells += `<td>${row.ord}</td>`;
      cells += thumbCell(row.thumb);
      cells += `<td><a class="rowlink" onclick="openEdit('${row.editKey}')">${row.label.replace(/\\n/g,'<br>')}</a></td>`;
      cells += `<td>${row.period}</td>`;
      cells += pillCell(row.use);
      cells += `<td>${row.updated}</td>`;
      return cells;
    };
  });
  return renderListGeneric(cfg, {checkedMid:true});
}

function stripHeader(html){
  return html
    .replace(/<div class="crumb">[\s\S]*?<\/div>/, '')
    .replace(/<h2 class="pagetitle"[^>]*>[\s\S]*?<\/h2>/, '');
}
const NOTE = (label,t)=>`<div class="note-amber" title="${t}"><b>${label}:</b> ${t}</div>`;
const EXCEL = `<button class="btn-line" onclick="alert('엑셀 다운로드 (프로토타입)')">&#8681; 엑셀 다운로드</button>`;
function cardify(html, o){
  o=o||{};
  const m=html.match(/<table class="gt[^"]*">[\s\S]*?<\/table>/);
  if(!m) return html;
  let total=(html.match(/Showing \d+-\d+ of ([\d,]+)/)||[])[1];
  if(!total){ const tb=m[0].match(/<tbody>[\s\S]*<\/tbody>/); total=tb?((tb[0].match(/<tr>/g)||[]).length-(tb[0].match(/emptyrow/g)||[]).length):0; }
  const title=o.title||(o.prefix?`${o.prefix} 총 ${total}건`:`총 ${total}건`);
  const card=`<div class="tcard"><div class="thead"><span>${title}</span><span class="ta">${o.actions||''}${o.excel===true?EXCEL:''}</span></div><div class="tscroll">${m[0]}</div></div>`;
  return html.replace(m[0],()=>card);
}

}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function periodArr(p){
  const m=p.match(/(\d{4})-(\d{2})-(\d{2})[^~]*~\s*(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return [p,''];
  const f=function(y,mo,d){ return MON[+mo-1]+' '+(+d)+', '+y; };
  return [f(m[1],m[2],m[3]),f(m[4],m[5],m[6])];
}

const VOC_PAGE=10;
function vocFiltered(){
  const v=state.voc;
  return VOC_ROWS.filter(function(r){
    const d=r.at.slice(0,10);
    if(v.from && d<v.from) return false;
    if(v.to && d>v.to) return false;
    if(v.center!=='all' && r.center!==v.center) return false;
    if(v.stu && r.stu.indexOf(v.stu)<0) return false;
    if(v.sent==='Y' && r.sent!=='Y') return false;
    if(v.sent==='N' && r.sent!=='N') return false;
    if(v.sent==='none' && r.sent!=='') return false;
    return true;
  });
}

function cmpCells(a,b){
  a=String(a).trim(); b=String(b).trim();
  const num=/^-?[\d,]+(\.\d+)?$/;
  if(num.test(a)&&num.test(b)) return parseFloat(a.replace(/,/g,''))-parseFloat(b.replace(/,/g,''));
  return a.localeCompare(b,'ko');
}
function sortTbl(th){

  Array.prototype.forEach.call(tr.cells,function(c){ c.classList.remove('asc'); c.classList.remove('desc'); });

const ADV_SECTIONS=['노출정보 - 타서비스 연결','디지털 타겟 액티비티'];
function goSec(id){
  const el=document.getElementById(id); if(!el) return;
  if(el.classList) el.classList.remove('collapsed');
  if(el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function toggleSec(h){ const p=h.parentNode; if(p&&p.classList) p.classList.toggle('collapsed'); }
function sectionize(html){
  const re=/(<div class="form-card">)([\s\S]*?)(<div class="form-foot">[\s\S]*)$/;
  const m=html.match(re); if(!m) return html;
  const parts=m[2].split(/(<div class="form-section-title"[^>]*>[\s\S]*?<\/div>)/);
  let out=parts[0], toc=[], n=0;
  for(let i=1;i<parts.length;i+=2){
    const title=parts[i], body=parts[i+1]||'';
    const plain=title.replace(/<[^>]+>/g,'').trim();
    const adv=ADV_SECTIONS.some(function(a){return plain.indexOf(a)===0;});
    n++; const id='fs-'+n;
    toc.push({id:id,adv:adv,label:plain.replace(/드림스 연동 · 읽기전용/,'').replace(/\s*\(.*\)\s*$/,'').trim()});
    const inner=title.replace(/^<div[^>]*>/,'').replace(/<\/div>$/,'');
    out+=`<div class="fsec ${adv?'collapsed':''}" id="${id}"><div class="form-section-title fsec-h" onclick="toggleSec(this)">${inner}${adv?'<span class="adv-chip">고급</span>':''}<span class="fsec-car"></span></div><div class="fsec-body">${body}</div></div>`;
  }
  const tocHtml=`<div class="sec-toc">${toc.map(function(t){return `<a onclick="goSec('${t.id}')">${t.label}${t.adv?'<i>고급</i>':''}</a>`;}).join('')}</div>`;
  return html.replace(re,function(all,a,b,c){ return tocHtml+a+out+c; });
}

function convertDateboxes(html){
  let n=0;
  return html.replace(/<div class="datebox"><span class="ic">&#128197;<\/span>([\s\S]*?)<\/div>/g,function(all,txt){

    if(!ds.length){ const reI=/(\d{4})-(\d{2})-(\d{2})(?:\s+(\d{1,2}):(\d{2}))?/g; while((m=reI.exec(txt))){ ds.push({y:m[1],mo:+m[2],d:+m[3],t:(m[4]!=null)?[+m[4],m[5]]:null}); } }
    if(!ds.length) return all;

function vocStepper(){

  return `<div class="stepper">${names.map(function(t,i){ return `<div class="step ${st>i+1?'done':(st===i+1?'active':'')}"><span class="sn">${st>i+1?'&#10003;':(i+1)}</span>${t}</div>`; }).join('<span class="sline"></span>')}</div>`;
}
function vocDone(){
  const l=state.vocLast; if(!l) return '';
  return `<div class="voc-done">&#10003; 마지막 추출 · <b>${l.n}건</b> · ${l.at} · 사유 "${esc(l.reason)}" <a class="freset" style="margin-left:8px" onclick="go('auth-log')">변경 이력에서 보기</a></div>`;
}
function vocCondText(){
  const v=state.voc, a=[];
  a.push('기간 '+(v.from||'제한 없음')+' ~ '+(v.to||'제한 없음'));
  if(v.center!=='all') a.push('센터 '+v.center);
  if(v.stu) a.push('학생번호 '+v.stu);
  if(v.sent!=='all') a.push('발송 여부 '+({Y:'Y',N:'N',none:'요청 없음'}[v.sent]));

}

function csvCell(x){ x=String(x==null?'':x); return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; }
function downloadCsv(name,text){
  try{
    const blob=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },1000);
    return true;
  }catch(e){ return false; }
}
function confirmVocExtract(){

  er.innerHTML=msg; if(el.classList) el.classList.toggle('err',!!msg);

  const csv=[head].concat(rows.map(function(r){ return [r.at,r.center,r.stu,r.dev,r.serial,r.sent||'-',r.req||'-']; })).map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');

/* 노출기간 겹침 */
function periodsOverlap(a1,a2,b1,b2){ return a1<=b2 && b1<=a2; }
function evPeriodISO(p){ const m=p.match(/(\d{4})\.(\d{2})\.(\d{2})~(\d{4})\.(\d{2})\.(\d{2})/); return m?[m[1]+'-'+m[2]+'-'+m[3],m[4]+'-'+m[5]+'-'+m[6]]:['','']; }
function overlapItems(){
  const key=state.editKey; if(!key) return [];
  const sEl=document.getElementById('f-date-s'), eEl=document.getElementById('f-date-e'); if(!sEl||!eEl) return [];
  const s=sEl.value.slice(0,10), e=eEl.value.slice(0,10); if(!s||!e||s>e) return [];
  const useEl=document.querySelector('input[name="f-use"]:checked'); if(useEl&&useEl.value==='0') return [];
  let list=[];
  const brow=(key==='regBanner')?null:bannerRow(key);
  if(key==='regBanner'||brow){
    const type=(key==='regBanner')?(state.reg&&state.reg.type):(bannerPopupRows().find(function(x){return x.r.editKey===key;})||{}).t;
    list=bannerPopupRows().filter(function(x){return x.t===type&&x.r.editKey!==key&&x.r.use;}).map(function(x){ return {label:x.r.label.replace(/\\n/g,' '),p:periodISO(x.r.period)}; });
  } else if((key==='regNotice'&&state.reg&&state.reg.type==='event')||String(key).indexOf('evt')===0){
    list=badgeEvents.rows.filter(function(r){return r.id!==key&&r.expose;}).map(function(r){ return {label:r.name,p:evPeriodISO(r.period)}; });
  }
  return list.filter(function(x){ return x.p[0] && periodsOverlap(s,e,x.p[0],x.p[1]); });
}
function setWarn(el,msg){
  if(!el||!el.closest) return;
  const body=el.closest('.fbody'); if(!body) return;
  let w=body.querySelector('.field-warn');
  if(!w){ w=document.createElement('div'); w.className='field-warn'; body.appendChild(w); }
  w.textContent=msg||'';
}
function liveOverlapHint(e){
  const t=e&&e.target; if(!t||!t.closest||!document.querySelector) return;
  if(!(t.closest('.daterange')||t.name==='f-use')) return;
  const dr=document.querySelector('.form-card .daterange'); if(!dr) return;
  const ov=overlapItems();
  setWarn(dr,ov.length?('같은 유형에 노출기간이 겹치는 노출 건이 '+ov.length+'건 있습니다. ('+ov[0].label+(ov.length>1?' 외':'')+')'):'');
}
